name: Rust runtime
on:
  workflow_dispatch:
    inputs:
      binary_run_id:
        description: Optional existing binary-build run for packaging tests only; no image is published
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: rust-${{ github.ref }}-${{ inputs.binary_run_id || 'build' }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !inputs.binary_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build native static binaries
        run: docker buildx build -f rust/build.Dockerfile --build-arg REVISION="$GITHUB_SHA" --target binaries --output type=local,dest=rust/dist/binaries/${{ matrix.arch }} .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-binaries-${{ matrix.arch }}
          path: rust/dist/binaries/${{ matrix.arch }}/
          retention-days: 7
          compression-level: 0
  package:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.binary_run_id) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-binaries-*
          path: rust/dist/downloads
          run-id: ${{ inputs.binary_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Package native and compatible legacy downloads
        run: |
          mkdir -p rust/dist/binaries rust/dist/rootfs/data rust/dist/rootfs/run/runner rust/dist/rootfs/etc
          mv rust/dist/downloads/rust-binaries-amd64 rust/dist/binaries/amd64
          mv rust/dist/downloads/rust-binaries-arm64 rust/dist/binaries/arm64
          chmod +x rust/dist/binaries/amd64/* rust/dist/binaries/arm64/*
          printf 'runner:x:1000:1000:Runner:/data:/nonexistent\n' > rust/dist/rootfs/etc/passwd
          printf 'runner:x:1000:\n' > rust/dist/rootfs/etc/group
          chmod 700 rust/dist/rootfs/data rust/dist/rootfs/run/runner
          python3 rust/build-assets.py --binaries rust/dist/binaries --output rust/dist/assets
      - name: Verify official etcd Raft quorum, failover and restart behavior
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work \
            node:24-alpine node control/test/ui-lifecycle.mjs
          docker run --rm --network none -v "$PWD:/work" -w /work \
            -e RUST_CONTROL_BINARY=/work/rust/dist/binaries/amd64/runner-control \
            -e CP_RAFT_BINARY=/work/rust/dist/binaries/amd64/runner-raft \
            -e CP_ETCD_RAFT_BINARY=/work/rust/dist/binaries/amd64/runner-etcd-raft \
            -e HA_FAULT_MATRIX=1 -e HA_FAULT_SEED=41 -e HA_RESULT=/work/rust/dist/ha-failures.json \
            node:24-alpine node control/test/ha-service.mjs
      - name: Retain native HA failure-scenario results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ha-failure-results
          path: rust/dist/ha-failures.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build and smoke test the controller image
        run: |
          docker build -f rust/control.Dockerfile --build-arg REVISION="$GITHUB_SHA" -t runner-control:rust-test .
          docker run --rm runner-control:rust-test --version
          RUNNER_DATA=$(mktemp -d) RUNNER_RUST_IMAGE=runner-control:rust-test sh rust/run-agent.sh --version
          python3 rust/tests/docker-smoke.py
          python3 rust/tests/docker-agent.py
          python3 rust/tests/installer-rollback.py
      - name: Verify capacity scripts and provider packaging
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work \
            node:24-alpine node --test .github/scripts/capacity.test.mjs providers/github/scheduler.test.mjs
          docker run --rm --network none -v "$PWD:/work:ro" -w /work \
            node:24-alpine sh -c 'cp rust/dist/binaries/amd64/runner-etcd-raft /tmp/runners-raft-provider-test && chmod +x /tmp/runners-raft-provider-test && node providers/github/service.test.mjs'
          docker build -f providers/github/Dockerfile -t runner-provider:pool-test .
          provider_test=$(docker run -d --network none -e GITHUB_PROVIDERS='[]' runner-provider:pool-test)
          trap 'docker rm -f "$provider_test" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$provider_test" node -e "fetch('http://127.0.0.1:8924/readyz').then(r=>{if(!r.ok)process.exit(1)})"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$provider_test"
          exit 1
      - name: Publish versioned multi-architecture controller
        if: ${{ !inputs.binary_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name rust-release --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 -f rust/control.Dockerfile --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_REPOSITORY="https://github.com/$GITHUB_REPOSITORY" -t "ghcr.io/${GITHUB_REPOSITORY,,}/control:rust-$GITHUB_SHA" --metadata-file rust/dist/control-image.json --push .
          mkdir -p rust/dist/agent-image/bin
          cp rust/agent.Dockerfile rust/dist/agent-image/Dockerfile
          cp rust/dist/binaries/amd64/runner-agent rust/dist/agent-image/bin/runner-agent-linux-amd64
          cp rust/dist/binaries/arm64/runner-agent rust/dist/agent-image/bin/runner-agent-linux-arm64
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg SOURCE_REPOSITORY="https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "ghcr.io/${GITHUB_REPOSITORY,,}/agent:rust-$GITHUB_SHA" --push rust/dist/agent-image
          docker buildx build --platform linux/amd64,linux/arm64 -f providers/github/Dockerfile --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_REPOSITORY="https://github.com/$GITHUB_REPOSITORY" -t "ghcr.io/${GITHUB_REPOSITORY,,}/fleet-provider:rust-$GITHUB_SHA" --metadata-file rust/dist/provider-image.json --push .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.binary_run_id }}
        with:
          name: pool-runtime-images
          path: |
            rust/dist/control-image.json
            rust/dist/provider-image.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-runtime-assets
          path: rust/dist/assets/
          retention-days: 7
          compression-level: 0
