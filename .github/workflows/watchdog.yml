name: Machine schedule
run-name: ${{ inputs.refill_slot && format('Machine schedule (refill {0})', inputs.refill_slot) || 'Machine schedule' }}

# Fleet Provider alone requests supply; there is no cron or completion fallback.
on:
  workflow_dispatch:
    inputs:
      refill_slot:
        description: UTC refill slot in milliseconds, supplied by the provider app
        type: string
        required: true
      provider_signature:
        description: Authentication signature supplied by Fleet Provider
        type: string
        required: true

concurrency:
  group: provider-capacity
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    if: ${{ vars.CONTROL_URL != '' && vars.CAPACITY_TRIGGER == 'provider' && inputs.refill_slot != '' && inputs.provider_signature != '' && (vars.MACHINE_COUNT != '' || vars.POOL_SIZE != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reconcile Fleet Provider machine supply
        env:
          GH_TOKEN: ${{ github.token }}
          MACHINE_COUNT: ${{ vars.MACHINE_COUNT || vars.POOL_SIZE }}
          SERVER_TAG: ${{ vars.SERVER_TAG || vars.POOL || 'github' }}
          MACHINE_REF: ${{ github.event.repository.default_branch }}
          CAPACITY_TRIGGER: ${{ vars.CAPACITY_TRIGGER }}
          CAPACITY_SLOT: ${{ inputs.refill_slot }}
          CAPACITY_SIGNATURE: ${{ inputs.provider_signature }}
          CAPACITY_AUTH_KEY: ${{ secrets.FLEET_PROVIDER_DISPATCH_KEY }}
          CAPACITY_PHASE_MIN: ${{ vars.CAPACITY_PHASE_MIN || '2' }}
          CAPACITY_INTERVAL_MIN: ${{ vars.CAPACITY_INTERVAL_MIN || '10' }}
        run: node .github/scripts/capacity.mjs
